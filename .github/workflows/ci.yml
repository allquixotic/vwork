name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust
        run: rustup update stable --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package tool fixtures
        run: |
          python -m pip install uv
          npm install --global aws-cdk
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +stable test --locked --all-targets
        env:
          VWORK_TEST_PYTHON: python
          VWORK_TEST_PACKAGE_TOOLS: "1"
      - name: Repeat lifecycle race regressions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            cargo +stable test --locked --test workspaces v21_
          done
          for attempt in {1..5}; do
            cargo +stable test --locked --test daemon v22_periodic_cleanup -- --exact
          done
