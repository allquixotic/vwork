name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust
        run: rustup update stable --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        shell: pwsh
        env:
          VWORK_TEST_PYTHON: python
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --all-targets
          exit $LASTEXITCODE
      - name: Build Windows x64
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc
      - name: Smoke test native lifecycle
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/vwork.exe'
          $state = Join-Path $env:RUNNER_TEMP 'vwork-release-smoke'
          & $exe --home $state start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --home $state doctor
          $result = $LASTEXITCODE
          & $exe --home $state stop
          if ($result -ne 0) { exit $result }
          exit $LASTEXITCODE
      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/vwork.exe'
          & $exe package --root . --binary $exe --output dist/vwork-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/vwork-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  vwork-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/vwork-windows-x64.zip dist/SHA256SUMS --title "vwork ${{ github.ref_name }}" --notes-file docs/release-notes.md --verify-tag
