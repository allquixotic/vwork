name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: vwork-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'allquixotic/vwork'
    runs-on: windows-latest
    timeout-minutes: 40
    environment: azure-artifact-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stable Rust
        run: rustup update stable --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package tool fixtures
        run: |
          python -m pip install uv
          npm install --global aws-cdk
      - name: Verify tagged release source
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,re,tomllib; base='v'+tomllib.load(open('Cargo.toml','rb'))['package']['version']; assert re.fullmatch(re.escape(base)+r'(?:\+build\.[1-9]\d*)?',os.environ['GITHUB_REF_NAME'])"
      - name: Validate
        shell: pwsh
        env:
          VWORK_TEST_PYTHON: python
          VWORK_TEST_PACKAGE_TOOLS: "1"
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --all-targets
          exit $LASTEXITCODE
      - name: Build Windows x64
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc
      - name: Azure login for Artifact Signing (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      - name: Ensure Azure signing module repository exists
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Get-PSRepository -Name PSGallery -ErrorAction Stop | Format-Table Name, SourceLocation
      - name: Sign Windows executable
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/vwork.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false
      - name: Verify publisher and timestamp
        env:
          VWORK_WINDOWS_PUBLISHER: ${{ vars.VWORK_WINDOWS_PUBLISHER }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./.github/scripts/verify-windows-signature.ps1 target/x86_64-pc-windows-msvc/release/vwork.exe dist/windows-signing.json
      - name: Smoke test native lifecycle
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/vwork.exe'
          $state = Join-Path $env:RUNNER_TEMP 'vwork-release-smoke'
          $reply = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | & $exe --home $state mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $message = $reply | ConvertFrom-Json -ErrorAction Stop
          if ($message.id -ne 1 -or $message.result.serverInfo.name -ne 'vwork') { throw 'Invalid MCP startup response' }
          $owner = (Get-Content (Join-Path $state 'connection.json') -Raw | ConvertFrom-Json).pid
          & $exe --home $state start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content (Join-Path $state 'connection.json') -Raw | ConvertFrom-Json).pid -ne $owner) { throw 'Daemon was replaced instead of reused' }
          & $exe --home $state doctor
          $result = $LASTEXITCODE
          & $exe --home $state stop
          if ($result -ne 0) { exit $result }
          exit $LASTEXITCODE
      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/vwork.exe'
          & $exe package --root . --binary $exe --output dist/vwork-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/vwork-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  vwork-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Attest final signed package
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vwork-windows-x64.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh attestation verify dist/vwork-windows-x64.zip --repo $env:GH_REPO --signer-workflow "$env:GH_REPO/.github/workflows/release.yml" --source-ref $env:GITHUB_REF --source-digest $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item '${{ steps.provenance.outputs.bundle-path }}' dist/windows-attestation.sigstore.json
          gh release create "${{ github.ref_name }}" dist/vwork-windows-x64.zip dist/SHA256SUMS dist/windows-signing.json dist/windows-attestation.sigstore.json --latest --title "vwork ${{ github.ref_name }}" --notes-file docs/release-notes.md --verify-tag
      - name: Retain signing evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-release-evidence
          path: dist/*
          if-no-files-found: ignore
