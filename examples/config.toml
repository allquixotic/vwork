compression_level = 3
port = 0
max_file_bytes = 67108864
max_results = 1000
max_output_bytes = 1048576
max_cached_bases = 4
max_run_history = 20
task_timeout_seconds = 600
temporary_ttl_seconds = 1800
temporary_max_ttl_seconds = 86400
max_temporary_copies = 4
max_recovery_bytes = 134217728

# Automatic compaction: hourly, input idle >5 min, estimated free space >1 GB
auto_compact = true
compact_interval_seconds = 3600
compact_idle_seconds = 300
compact_min_reclaim_bytes = 1000000000
